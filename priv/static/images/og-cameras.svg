<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Classic Mac desktop: 1px horizontal pinstripe -->
    <pattern id="desk" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#a8a8a8"/>
      <rect y="2" width="4" height="2" fill="#b8b8b8"/>
    </pattern>
    <!-- Title bar: vertical pinstripe -->
    <pattern id="stripes" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#fff"/>
      <rect x="1" width="1" height="3" fill="#000"/>
    </pattern>
    <!-- Thumbnail placeholder: diagonal hatch, like the page's missing-photo box -->
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fff"/>
      <rect width="2" height="6" fill="#000"/>
    </pattern>
  </defs>

  <!-- Desktop -->
  <rect width="1200" height="630" fill="url(#desk)"/>

  <!-- Menu bar -->
  <rect x="0" y="0" width="1200" height="34" fill="#fff"/>
  <rect x="0" y="33" width="1200" height="2" fill="#000"/>
  <text x="22" y="24" font-family="'Chicago','Geneva','Helvetica',sans-serif" font-size="17" fill="#000">&#63743;</text>
  <text x="52" y="24" font-family="'Chicago','Geneva','Helvetica',sans-serif" font-size="16" fill="#000">Finder</text>
  <text x="126" y="24" font-family="'Chicago','Geneva','Helvetica',sans-serif" font-size="16" fill="#000">Blog</text>
  <text x="182" y="24" font-family="'Chicago','Geneva','Helvetica',sans-serif" font-size="16" fill="#000">Directory</text>
