<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEE Right Through — five directions</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Five landing page directions for SEE Right Through Consulting.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23e8e9eb' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='11' fill='%23e8e9eb'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bar:#14161a;--line:#2a2e35;--txt:#e8e9eb;--dim:#8b9099;--go:#4ade80}
  html,body{height:100%}
  body{font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0c0d10;color:var(--txt);display:flex;flex-direction:column;overflow:hidden}
  header{background:var(--bar);border-bottom:1px solid var(--line);padding:.6rem .9rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;flex:none}
  .ttl{font-weight:650;letter-spacing:-.01em;white-space:nowrap}
  .ttl span{color:var(--dim);font-weight:400}
  nav{display:flex;gap:.3rem;flex-wrap:wrap}
  button{font:inherit;font-weight:550;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:6px;padding:.35rem .7rem;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  button:hover{color:var(--txt);border-color:#3d434c}
  button[aria-current="true"]{background:var(--txt);color:#0c0d10;border-color:var(--txt)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--go);outline-offset:2px}
  .right{margin-left:auto;display:flex;align-items:center;gap:.6rem}
  .desc{color:var(--dim);font-size:12.5px;padding:.45rem .9rem;background:#101216;border-bottom:1px solid var(--line);flex:none}
  .desc b{color:var(--txt);font-weight:600}
  .stage{flex:1;min-height:0;display:flex;justify-content:center;background:#0c0d10}
  .stage.mobile{padding:1.1rem 0;background:#08090b}
  iframe{width:100%;height:100%;border:0;background:#fff;display:block}
  .stage.mobile iframe{width:390px;flex:none;border-radius:14px;border:1px solid var(--line)}
  a.open{color:var(--dim);text-decoration:none;font-size:12.5px;border-bottom:1px solid var(--line)}
  a.open:hover{color:var(--txt)}
  @media (max-width:640px){.right{width:100%;margin-left:0}.ttl span{display:none}}
</style>
</head>
<body>
<header>
  <div class="ttl">SEE Right Through <span>· five directions</span></div>
  <nav id="nav" aria-label="Design versions"></nav>
  <div class="right">
    <button id="vw" type="button">Mobile view</button>
    <a class="open" id="open" href="/seth/v1" target="_blank" rel="noopener">Open full page</a>
  </div>
</header>
<p class="desc" id="desc"></p>
<div class="stage" id="stage"><iframe id="f" title="Design preview" src="/seth/v1"></iframe></div>
<script>
const V=[
 {id:'v1',n:'The Brief',d:'Hero is a real, readable Launch Kit — the artifact a client actually receives. Bets that showing the work beats describing it.'},
 {id:'v2',n:'Utilization',d:'Built on the seat-utilization report. Aimed at the RevOps buyer who signed the contract and has to defend the usage data.'},
 {id:'v4',n:'Two Columns',d:'The entire page is one sustained comparison: no owner versus an owner. Every claim sits beside its alternative.'},
 {id:'v5',n:'The Engagement',d:'Structured as time. A vendor CSM churns before they understand your business; the point is that he is still there in month 12.'},
 {id:'v6',n:'Accumulation',d:'v5 taken further: the right side of the screen starts empty and fills with the work as you scroll, until it outweighs the narrative beside it.'},
 {id:'v7',n:'Feed',d:'Short-form grammar: a vertical feed of full-bleed cards, one claim each, flipping down as you flick. Built for the format rather than adapted to it.'}
];
const nav=document.getElementById('nav'),f=document.getElementById('f'),desc=document.getElementById('desc'),
      open_=document.getElementById('open'),stage=document.getElementById('stage'),vw=document.getElementById('vw');
let cur=0;
V.forEach((v,i)=>{const b=document.createElement('button');b.type='button';
  b.textContent=v.id.toUpperCase()+' · '+v.n;b.onclick=()=>sel(i);nav.appendChild(b);});
function sel(i){cur=i;const v=V[i];f.src='/seth/'+v.id;open_.href='/seth/'+v.id;
  desc.innerHTML='<b>'+v.n+'</b> — '+v.d;
  [...nav.children].forEach((b,j)=>b.setAttribute('aria-current',j===i));
  history.replaceState(null,'','#'+v.id);}
vw.onclick=()=>{const m=stage.classList.toggle('mobile');vw.textContent=m?'Desktop view':'Mobile view';};
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;
  if(e.key==='ArrowRight')sel((cur+1)%V.length);
  if(e.key==='ArrowLeft')sel((cur+V.length-1)%V.length);});
const h=location.hash.slice(1), i0=V.findIndex(v=>v.id===h);
sel(i0>=0?i0:0);
</script>
</body>
</html>
