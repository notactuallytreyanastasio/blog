services:
  db:
    image: postgres:17
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: blog_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Not exposed to host - only accessible from app containers

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./cookies.txt:/app/cookies.txt:ro
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/blog_prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST:-bobbby.online}
      PORT: "4000"
      POOL_SIZE: "15"
      RECEIPT_PRINTER_API_TOKEN: ${RECEIPT_PRINTER_API_TOKEN:-}
      LIVE_DRAFT_TOKEN: ${LIVE_DRAFT_TOKEN:-}
      # Turns factory_report's observer actions on, behind this bearer token
      # (obs-factor sends it as OBSERVER_ACTIONS_TOKEN). Unset: 403.
      FACTORY_REPORT_ACTIONS_TOKEN: ${OBS_FACTOR_ACTIONS_TOKEN}
      BLINKS_API_TOKEN: ${BLINKS_API_TOKEN:-}
      FINDER_ADMIN_PASSWORD: ${FINDER_ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.1}
      ZIGGY_CHAT_PASSWORD: ${ZIGGY_CHAT_PASSWORD:-}
      LOLLY_CHAT_PASSWORD: ${LOLLY_CHAT_PASSWORD:-}
      ROOTED_CHAT_PASSWORD: ${ROOTED_CHAT_PASSWORD:-}
      # /who ("Ask the TARDIS") runs on Blog.LLM, DeepSeek by default; the same
      # key marginalia and blimp-blog below already read from .env. The
      # password falls back to ZIGGY_CHAT_PASSWORD in config/runtime.exs.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      WHO_CHAT_PASSWORD: ${WHO_CHAT_PASSWORD:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-bobbby-media}
      # APNs push for the blinks iOS app (base64 of the .p8 AuthKey)
      APNS_KEY_P8_B64: ${APNS_KEY_P8_B64:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-online.bobbby.blinks-reader}
      # mid-tier model for the camera browser analyst (shares OPENAI_API_KEY above)
      CAMERA_ANALYST_MODEL: ${CAMERA_ANALYST_MODEL:-gpt-5.4-mini}
      # Web Push (VAPID) for the blinks PWA
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://bobbby.online}
      # iCloud shared album behind /gallery (token from the album's public-website url)
      ICLOUD_ALBUM_TOKEN: ${ICLOUD_ALBUM_TOKEN:-}
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  blinks:
    build:
      context: /opt/blinks_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      FACTORY_REPORT_ACTIONS_TOKEN: ${OBS_FACTOR_ACTIONS_TOKEN}
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/blinks_backend_prod
      SECRET_KEY_BASE: ${BLINKS_SECRET_KEY_BASE}
      PHX_HOST: links.bobbby.online
      PORT: "4000"
      POOL_SIZE: "10"
      BLINKS_API_TOKEN: ${BLINKS_API_TOKEN:-}
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  # Marginalia — the writers' product. Own source tree at /opt/marginalia and
  # own database, but shares this stack's Postgres and Caddy.
  marginalia:
    build:
      context: /opt/marginalia
    restart: always
    deploy:
      replicas: 5
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/marginalia_prod
      SECRET_KEY_BASE: ${MARGINALIA_SECRET_KEY_BASE}
      PHX_HOST: marginalia.bobbby.online
      PORT: "4000"
      # Five replicas share Postgres, which was at 93 of 100 (3 of them
      # reserved for superusers) with three: 2 each is 10, plus the two
      # leadership-lock connections (Marginalia.Singleton) is 12, two fewer
      # than three replicas at 4 each. Load is ~0.2 req/s.
      POOL_SIZE: "2"
      # A cluster: DNSCluster resolves the service name to every replica and
      # connects marginalia@<ip> to each (rel/env.sh.eex names the nodes).
      DNS_CLUSTER_QUERY: marginalia
      # Turns factory_report's observer actions on, behind this bearer token
      # (obs-factor sends it as OBSERVER_ACTIONS_TOKEN). Unset: 403.
      FACTORY_REPORT_ACTIONS_TOKEN: ${OBS_FACTOR_ACTIONS_TOKEN}
      RELEASE_COOKIE: ${MARGINALIA_RELEASE_COOKIE}
      # Marginalia defaults to DeepSeek and reads DEEPSEEK_API_KEY. Without
      # this line the container had only the OpenAI key, so every read failed
      # on a provider whose key was sitting unused in .env.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${MARGINALIA_LLM_PROVIDER:-deepseek}
      OWNER_EMAIL: ${MARGINALIA_OWNER_EMAIL:-bobbbygrayson@gmail.com}
      # Each draft's git history. Must be on a volume: the container is
      # rebuilt on every deploy, so a repo written to its own filesystem is
      # destroyed by the next one and the loss looks like success.
      DRAFT_REPO_ROOT: /data/drafts
    volumes:
      - marginalia_drafts:/data/drafts
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  # Tyler — a finder for Disability Rights Oregon's public documents, forked
  # from marginalia. Own source tree at /opt/tyler/app (shipped by the tyler
  # repo's deploy.sh) and own database, sharing this stack's Postgres and
  # Caddy. The crawl's downloaded PDFs are mounted read-only from
  # /opt/tyler/data; the app serves them as the "original file" links.
  tyler:
    build:
      context: /opt/tyler/app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/tyler_prod
      SECRET_KEY_BASE: ${TYLER_SECRET_KEY_BASE}
      PHX_HOST: tyler.bobbby.online
      PORT: "4000"
      POOL_SIZE: "10"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: deepseek
      TYLER_DATA: /data
    volumes:
      - /opt/tyler/data:/data:ro
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  # Dave — the classroom music viewer for Dave's music class. Imports scores
  # from Noteflight Learning URLs (no login needed on those endpoints) and
  # syncs a moving cursor across every kid's iPad via Phoenix Channels (the
  # server is the master clock, see lib/dave/sessions.ex there). Own source
  # tree at /opt/dave (rsynced by the dave repo's deploy.sh), own database,
  # shares this stack's Postgres and Caddy (dave.bobbby.online).
  dave:
    build:
      context: /opt/dave
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/dave_prod
      SECRET_KEY_BASE: ${DAVE_SECRET_KEY_BASE}
      PHX_HOST: dave.bobbby.online
      PORT: "4000"
      POOL_SIZE: "10"
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  # skyfeed — Bluesky maps + feed construction (bsky_exploration/skyfeed; its deploy.sh
  # rsyncs the source to /opt/skyfeed and a data snapshot to /opt/skyfeed-data). No
  # database: it reads the map/profile snapshot mounted at /data and keeps exactly one
  # Jetstream websocket open. Saved feeds are written to /data/feeds, list jobs to /data/lists.
  skyfeed:
    build:
      context: /opt/skyfeed
    restart: always
    environment:
      SECRET_KEY_BASE: ${SKYFEED_SECRET_KEY_BASE}
      PHX_HOST: bskymapfeeds.bobbby.online
      PORT: "4000"
      SKYFEED_DATA_DIR: /data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # bot account that owns the Bluesky lists made from map selections (app password)
      LIST_BOT_HANDLE: ${SKYFEED_LIST_BOT_HANDLE:-}
      LIST_BOT_APP_PASSWORD: ${SKYFEED_LIST_BOT_APP_PASSWORD:-}
    volumes:
      - /opt/skyfeed-data:/data
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  # Shared decision graph. One Postgres database behind an MCP endpoint, one
  # workspace per project, serving every graph on the laptop. Caddy proxies
  # bobbby.online/deciduous-mcp/* here. See /opt/deciduous-mcp/DEPLOY.md.
  deciduous-mcp:
    build:
      context: /opt/deciduous-mcp
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/deciduous_mcp_prod
      DECIDUOUS_MCP_TOKEN: ${DECIDUOUS_MCP_TOKEN}
      PORT: "4000"
      POOL_SIZE: "10"
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  dtree-ai:
    # DeepSeek proxy for the MBA-or-DJ classroom site (github.com/notactuallytreyanastasio/mba-vs-dj, proxy/).
    # Holds the key so the static site does not; rate-limited per IP and per day.
    build:
      context: /opt/dtree-ai
    restart: always
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PORT: "8080"
    # Not exposed to host - Caddy proxies to port 8080 via Docker network

  nathan:
    build:
      context: /opt/nathan
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      FACTORY_REPORT_ACTIONS_TOKEN: ${OBS_FACTOR_ACTIONS_TOKEN}
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/nathan_for_us_prod
      SECRET_KEY_BASE: ${NATHAN_SECRET_KEY_BASE}
      PHX_HOST: gifmaker.bobbby.online
      PORT: "4001"
      POOL_SIZE: "10"
      PHX_SERVER: "true"
      BLUESKY_USERNAME: ${BLUESKY_USERNAME:-}
      BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}
      GOOGLE_ANALYTICS_ID: ${NATHAN_GOOGLE_ANALYTICS_ID:-}
      # Legacy shared ingest key (optional) — per-user fc_ keys work without it
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    # Not exposed to host - Caddy proxies to port 4001 via Docker network

  # The LIVE Claude Arena — three daemons (watcher http :8901, commissioner,
  # league grinder) supervised by deploy/arena-supervisor.mjs in the soldat
  # repo, which is rsynced to /opt/soldat by its deploy/deploy-arena-live.sh.
  # The repo is BIND-MOUNTED at /app: node_modules + pnpm store live on the
  # host inside /opt/soldat (the supervisor pnpm-installs on boot), so a
  # redeploy is rsync + `docker compose restart soldat` — no image rebuild.
  # Caddy proxies bobbby.online/arena/* -> soldat:8901 (play/ stays static)
  # and /arena/ws -> soldat:8902 (the online-1v1 game server, a 4th
  # supervised daemon).
  soldat:
    build:
      context: /opt/soldat
      dockerfile: deploy/arena-live.Dockerfile
    restart: unless-stopped
    environment:
      ARENA_WATCH_BASE: /arena/play
      # Cap the shipped fight feeds: the full data.json crossed 300 MB and the
      # floor polls it every 5s — 40 matches the publish snapshot (~5 MB).
      ARENA_DATA_FIGHTS: "40"
      TZ: UTC
      PORT: "8901"
      GAME_SERVER_PORT: "8902"
    expose:
      - "8902"
    volumes:
      - /opt/soldat:/app
    # Not exposed to host - Caddy proxies to ports 8901/8902 via Docker network

  # Phone-remote relay for slides.bobbby.online — a tiny WebSocket message
  # router (the slides repo's server/relay.mjs). Caddy proxies
  # wss://slides.bobbby.online/relay -> slides-relay:8787. Like the soldat
  # service this is BIND-MOUNTED, not built: deploy-slides.sh rsyncs relay.mjs
  # and the pure-JS `ws` package into /opt/slides-relay, so a redeploy is rsync
  # + `docker compose restart slides-relay` — no image build. The relay holds no
  # deck content; it only forwards messages between same-room peers.
  slides-relay:
    image: node:20-alpine
    restart: always
    working_dir: /app
    command: ["node", "relay.mjs"]
    environment:
      PORT: "8787"
    expose:
      - "8787"
    volumes:
      - /opt/slides-relay:/app:ro
    # Not exposed to host - Caddy proxies to port 8787 via Docker network

  # The casino host's relay for Skee Skee Skee: holds the DeepSeek key so the
  # iOS app doesn't have to, and caps what the public can spend. Bind-mounted
  # like slides-relay; skee_skee_skee/relay/deploy.sh rsyncs it to
  # /opt/skee-relay. Caddy proxies bobbby.online/skee-host/* to it.
  skee-relay:
    image: node:24-alpine
    restart: always
    working_dir: /app
    command: ["node", "relay.mjs"]
    environment:
      PORT: "8788"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    expose:
      - "8788"
    volumes:
      - /opt/skee-relay:/app:ro

  # LUMINES HD rooms server — matchmaking + shared-board input/snapshot relay
  # (lumines_hd repo, server/ bundled to a single server.cjs by esbuild). Like
  # slides-relay this is BIND-MOUNTED, not built: lumines_hd/scripts/deploy.sh
  # rsyncs the bundle into /opt/lumines-server, so a redeploy is rsync +
  # `docker compose restart lumines`. Caddy proxies
  # wss://lumines.bobbby.online/ws -> lumines:8903; the static game build is
  # served by Caddy from /opt/lumines. Rooms hold no persistent state.
  lumines:
    image: node:24-alpine
    restart: always
    working_dir: /app
    command: ["node", "server.cjs"]
    environment:
      PORT: "8903"
    expose:
      - "8903"
    volumes:
      - /opt/lumines-server:/app:ro

  caddy:
    image: caddy:2.10.2
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # The JSON access log the factory tails (the `(access)` snippet in the
      # Caddyfile): no client addresses, headers or query strings, 150 MiB at most.
      - caddy_logs:/var/log/caddy
      - /opt/deciduous-site:/srv/deciduous:ro
      - /opt/phstats:/srv/phstats:ro
      - /opt/donny:/srv/donny:ro
      - /opt/blimp:/srv/blimp:ro
      - /opt/arena:/srv/arena:ro  # the Claude Arena snapshot (soldat repo, arena-live/publish.mjs)
      - /opt/soldat-landing:/srv/soldat-landing:ro  # the SOLDAT, REWRITTEN story page (soldat repo, landing/)
      - /opt/slides:/srv/slides:ro  # RevealSlides static build (slides repo dist/, via deploy-slides.sh)
      - /opt/downloader:/srv/downloader:ro  # Framecut Grabber landing page (nathan_for_us site/, via deploy.sh)
      - /opt/lumines:/srv/lumines:ro  # LUMINES HD static build (lumines_hd repo dist/, via its scripts/deploy.sh)
      - /opt/gaming:/srv/gaming:ro  # Pastel Garden Massacre (whats_going_through_your_mind repo, via its scripts/deploy.sh)
      - /opt/padmac:/srv/padmac:ro  # PadMac landing page (padmac repo site/, via its site/deploy.sh)

  # The blog, served by a server written in Blimp: blimp_site/ in the blog
  # repo, shipped to /opt/blimp-blog by blimp_site/deploy.sh. Caddy sends it
  # /, /blog, /post/* and its stylesheets, and gives Phoenix anything it
  # answers 404. It forks four workers that each exit after 200 requests;
  # the cap is there in case that arithmetic is ever wrong.
  blimp-blog:
    build:
      context: /opt/blimp-blog
    restart: always
    mem_limit: 1536m
    # The homepage museum and Finder are read from the blog database.
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Blimp unwinds a tick that would pass this (heap_limit.zig) instead of
      # letting the kernel kill the process at mem_limit (1536m). blog#217.
      BLIMP_HEAP_LIMIT: "1400000000"
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/blog_prod
      MTA_API_KEY: ${MTA_API_KEY}
      ICLOUD_ALBUM_TOKEN: ${ICLOUD_ALBUM_TOKEN}
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_BASE_URL: https://api.deepseek.com
      OPENAI_MODEL: deepseek-chat
      OPENAI_AUTOCOMPLETE_MODEL: deepseek-chat
      ZIGGY_CHAT_PASSWORD: ${ZIGGY_CHAT_PASSWORD:-}
      # /who's chat (blimp_site/src/99_who.blimp) falls back to the Ziggy one
      WHO_CHAT_PASSWORD: ${WHO_CHAT_PASSWORD:-}
      # /aim's bobbbyBot (blimp_site/src/99_aim.blimp)
      AIM_API_KEY: ${DEEPSEEK_API_KEY:-}
      AIM_DAILY_LIMIT: ${AIM_DAILY_LIMIT:-600}
      BLINKS_API_TOKEN: ${BLINKS_API_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://bobbby.online}
      FINDER_ADMIN_PASSWORD: ${FINDER_ADMIN_PASSWORD:-}
      CURATE_PASSWORD: ${CURATE_PASSWORD:-}
      RECEIPT_PRINTER_API_TOKEN: ${RECEIPT_PRINTER_API_TOKEN:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-bobbby-media}
    # Not exposed to host - Caddy proxies to port 4100 via Docker network

  # obs_factor — the live factory view of this stack (factory.bobbby.online).
  # Own source tree at /opt/obs_factor (rsynced by obs_factor's deploy.sh).
  # It reads, and only reads: Docker through docker-proxy, Caddy's :9180
  # metrics, one Postgres connection as the obs_factor role, the host's
  # /proc (a container's own /proc/{stat,meminfo,loadavg} are the host
  # kernel's, so nothing is mounted for it), statfs on an empty directory,
  # and the static sites' directories, read-only.
  obs-factor:
    build:
      context: /opt/obs_factor
    restart: always
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      PHX_HOST: factory.bobbby.online
      PORT: "4000"
      SECRET_KEY_BASE: ${OBS_FACTOR_SECRET_KEY_BASE}
      OBS_FACTOR_PASSWORD: ${OBS_FACTOR_PASSWORD}
      DOCKER_URL: http://docker-proxy:2375
      CADDY_METRICS_URL: http://caddy:9180/metrics
      # Hex password (openssl rand -hex 24): it sits in a URL unescaped.
      PG_URL: postgres://obs_factor:${OBS_FACTOR_DB_PASSWORD}@db/postgres
      HOST_PROC: /proc
      HOST_DISK_PATH: /hostfs
      SITES_DIR: /sites
      TOPOLOGY: /app/topology/prod.exs
      ACCESS_LOG: /caddy-logs/access.log
      # Mission objectives: a role and database of their own, writable
      # (deploy/objectives-db.sql), unlike PG_URL's read-only monitor.
      OBJECTIVES_PG_URL: postgres://obs_factor_app:${OBS_FACTOR_OBJECTIVES_DB_PASSWORD}@db/obs_factor
      # Sent with observer actions (gc, kill, restart); the apps hold the
      # same value as FACTORY_REPORT_ACTIONS_TOKEN.
      OBSERVER_ACTIONS_TOKEN: ${OBS_FACTOR_ACTIONS_TOKEN}
    volumes:
      # statfs() needs a path on the host's root filesystem and nothing else.
      # An empty directory, created by Docker (as root) on first `up`. NOT
      # /opt/blog (its .env holds every secret) and NOT /: a container's own
      # "/" is overlayfs and statfs reports the Docker data filesystem,
      # which is only the root filesystem if /var/lib/docker is on it.
      - /var/lib/obs_factor/statfs:/hostfs:ro
      - caddy_logs:/caddy-logs:ro
      # The static sites, read-only, one directory each, named as Caddy
      # mounts them under /srv. Every byte here is already public (Caddy's
      # file_server serves it), except that /opt/arena is mounted only at
      # its play/ subdirectory, which is all Caddy serves of it.
      - /opt/deciduous-site:/sites/deciduous:ro
      - /opt/phstats:/sites/phstats:ro
      - /opt/donny:/sites/donny:ro
      - /opt/blimp:/sites/blimp:ro
      - /opt/arena/play:/sites/arena:ro
      - /opt/soldat-landing:/sites/soldat-landing:ro
      - /opt/slides:/sites/slides:ro
      - /opt/downloader:/sites/downloader:ro
      - /opt/lumines:/sites/lumines:ro
      - /opt/gaming:/sites/gaming:ro
      - /opt/padmac:/sites/padmac:ro
    networks: [default, obs]
    # Not exposed to host - Caddy proxies factory.bobbby.online to port 4000

  # The observer's only door to the Docker Engine API: GET container list,
  # inspect and stats; 403 for everything else (deploy/docker-proxy/Caddyfile,
  # proven request by request in the README). The socket's :ro does not
  # make the API read-only - connect() works on a read-only bind of a
  # socket - so the allowlist is the boundary.
  #
  # On the "obs" network ONLY. Inspect returns every container's
  # Config.Env, i.e. every secret in .env; on the default network any app
  # (a public relay, say) could read them all. Only obs-factor joins "obs".
  docker-proxy:
    image: caddy:2.10.2
    restart: always
    mem_limit: 64m
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/obs_factor/deploy/docker-proxy:/etc/caddy:ro
    networks: [obs]
    # Not exposed to host, and not on the default network

volumes:
  marginalia_drafts:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  # obs_factor: internal (no route out of the box); only obs-factor and docker-proxy join it.
  obs:
    internal: true
