services:
  db:
    image: postgres:17
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: blog_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Not exposed to host - only accessible from app containers

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./cookies.txt:/app/cookies.txt:ro
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/blog_prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST:-bobbby.online}
      PORT: "4000"
      POOL_SIZE: "15"
      RECEIPT_PRINTER_API_TOKEN: ${RECEIPT_PRINTER_API_TOKEN:-}
      LIVE_DRAFT_TOKEN: ${LIVE_DRAFT_TOKEN:-}
      BLINKS_API_TOKEN: ${BLINKS_API_TOKEN:-}
      FINDER_ADMIN_PASSWORD: ${FINDER_ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.1}
      ZIGGY_CHAT_PASSWORD: ${ZIGGY_CHAT_PASSWORD:-}
      LOLLY_CHAT_PASSWORD: ${LOLLY_CHAT_PASSWORD:-}
      ROOTED_CHAT_PASSWORD: ${ROOTED_CHAT_PASSWORD:-}
      # /who ("Ask the TARDIS") runs on Blog.LLM, DeepSeek by default; the same
      # key marginalia and blimp-blog below already read from .env. The
      # password falls back to ZIGGY_CHAT_PASSWORD in config/runtime.exs.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      WHO_CHAT_PASSWORD: ${WHO_CHAT_PASSWORD:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-bobbby-media}
      # APNs push for the blinks iOS app (base64 of the .p8 AuthKey)
      APNS_KEY_P8_B64: ${APNS_KEY_P8_B64:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-online.bobbby.blinks-reader}
      # mid-tier model for the camera browser analyst (shares OPENAI_API_KEY above)
      CAMERA_ANALYST_MODEL: ${CAMERA_ANALYST_MODEL:-gpt-5.4-mini}
      # Web Push (VAPID) for the blinks PWA
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://bobbby.online}
      # iCloud shared album behind /gallery (token from the album's public-website url)
      ICLOUD_ALBUM_TOKEN: ${ICLOUD_ALBUM_TOKEN:-}
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  blinks:
    build:
      context: /opt/blinks_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/blinks_backend_prod
      SECRET_KEY_BASE: ${BLINKS_SECRET_KEY_BASE}
      PHX_HOST: links.bobbby.online
      PORT: "4000"
      POOL_SIZE: "10"
      BLINKS_API_TOKEN: ${BLINKS_API_TOKEN:-}
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  # Marginalia — the writers' product. Own source tree at /opt/marginalia and
  # own database, but shares this stack's Postgres and Caddy.
  marginalia:
    build:
      context: /opt/marginalia
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/marginalia_prod
      SECRET_KEY_BASE: ${MARGINALIA_SECRET_KEY_BASE}
      PHX_HOST: marginalia.bobbby.online
      PORT: "4000"
      POOL_SIZE: "10"
      # Marginalia defaults to DeepSeek and reads DEEPSEEK_API_KEY. Without
      # this line the container had only the OpenAI key, so every read failed
      # on a provider whose key was sitting unused in .env.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${MARGINALIA_LLM_PROVIDER:-deepseek}
      OWNER_EMAIL: ${MARGINALIA_OWNER_EMAIL:-bobbbygrayson@gmail.com}
      # Each draft's git history. Must be on a volume: the container is
      # rebuilt on every deploy, so a repo written to its own filesystem is
      # destroyed by the next one and the loss looks like success.
      DRAFT_REPO_ROOT: /data/drafts
    volumes:
      - marginalia_drafts:/data/drafts
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  # Tyler — a finder for Disability Rights Oregon's public documents, forked
  # from marginalia. Own source tree at /opt/tyler/app (shipped by the tyler
  # repo's deploy.sh) and own database, sharing this stack's Postgres and
  # Caddy. The crawl's downloaded PDFs are mounted read-only from
  # /opt/tyler/data; the app serves them as the "original file" links.
  tyler:
    build:
      context: /opt/tyler/app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/tyler_prod
      SECRET_KEY_BASE: ${TYLER_SECRET_KEY_BASE}
      PHX_HOST: tyler.bobbby.online
      PORT: "4000"
      POOL_SIZE: "10"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: deepseek
      TYLER_DATA: /data
    volumes:
      - /opt/tyler/data:/data:ro
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  # Dave — the classroom music viewer for Dave's music class. Imports scores
  # from Noteflight Learning URLs (no login needed on those endpoints) and
  # syncs a moving cursor across every kid's iPad via Phoenix Channels (the
  # server is the master clock, see lib/dave/sessions.ex there). Own source
  # tree at /opt/dave (rsynced by the dave repo's deploy.sh), own database,
  # shares this stack's Postgres and Caddy (dave.bobbby.online).
  dave:
    build:
      context: /opt/dave
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/dave_prod
      SECRET_KEY_BASE: ${DAVE_SECRET_KEY_BASE}
      PHX_HOST: dave.bobbby.online
      PORT: "4000"
      POOL_SIZE: "10"
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  # Shared decision graph. One Postgres database behind an MCP endpoint, one
  # workspace per project, serving every graph on the laptop. Caddy proxies
  # bobbby.online/deciduous-mcp/* here. See /opt/deciduous-mcp/DEPLOY.md.
  deciduous-mcp:
    build:
      context: /opt/deciduous-mcp
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/deciduous_mcp_prod
      DECIDUOUS_MCP_TOKEN: ${DECIDUOUS_MCP_TOKEN}
      PORT: "4000"
      POOL_SIZE: "10"
    # Not exposed to host - Caddy proxies to port 4000 via Docker network

  nathan:
    build:
      context: /opt/nathan
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/nathan_for_us_prod
      SECRET_KEY_BASE: ${NATHAN_SECRET_KEY_BASE}
      PHX_HOST: gifmaker.bobbby.online
      PORT: "4001"
      POOL_SIZE: "10"
      PHX_SERVER: "true"
      BLUESKY_USERNAME: ${BLUESKY_USERNAME:-}
      BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}
      GOOGLE_ANALYTICS_ID: ${NATHAN_GOOGLE_ANALYTICS_ID:-}
      # Legacy shared ingest key (optional) — per-user fc_ keys work without it
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    # Not exposed to host - Caddy proxies to port 4001 via Docker network

  # The LIVE Claude Arena — three daemons (watcher http :8901, commissioner,
  # league grinder) supervised by deploy/arena-supervisor.mjs in the soldat
  # repo, which is rsynced to /opt/soldat by its deploy/deploy-arena-live.sh.
  # The repo is BIND-MOUNTED at /app: node_modules + pnpm store live on the
  # host inside /opt/soldat (the supervisor pnpm-installs on boot), so a
  # redeploy is rsync + `docker compose restart soldat` — no image rebuild.
  # Caddy proxies bobbby.online/arena/* -> soldat:8901 (play/ stays static)
  # and /arena/ws -> soldat:8902 (the online-1v1 game server, a 4th
  # supervised daemon).
  soldat:
    build:
      context: /opt/soldat
      dockerfile: deploy/arena-live.Dockerfile
    restart: unless-stopped
    environment:
      ARENA_WATCH_BASE: /arena/play
      # Cap the shipped fight feeds: the full data.json crossed 300 MB and the
      # floor polls it every 5s — 40 matches the publish snapshot (~5 MB).
      ARENA_DATA_FIGHTS: "40"
      TZ: UTC
      PORT: "8901"
      GAME_SERVER_PORT: "8902"
    expose:
      - "8902"
    volumes:
      - /opt/soldat:/app
    # Not exposed to host - Caddy proxies to ports 8901/8902 via Docker network

  # Phone-remote relay for slides.bobbby.online — a tiny WebSocket message
  # router (the slides repo's server/relay.mjs). Caddy proxies
  # wss://slides.bobbby.online/relay -> slides-relay:8787. Like the soldat
  # service this is BIND-MOUNTED, not built: deploy-slides.sh rsyncs relay.mjs
  # and the pure-JS `ws` package into /opt/slides-relay, so a redeploy is rsync
  # + `docker compose restart slides-relay` — no image build. The relay holds no
  # deck content; it only forwards messages between same-room peers.
  slides-relay:
    image: node:20-alpine
    restart: always
    working_dir: /app
    command: ["node", "relay.mjs"]
    environment:
      PORT: "8787"
    expose:
      - "8787"
    volumes:
      - /opt/slides-relay:/app:ro
    # Not exposed to host - Caddy proxies to port 8787 via Docker network

  # LUMINES HD rooms server — matchmaking + shared-board input/snapshot relay
  # (lumines_hd repo, server/ bundled to a single server.cjs by esbuild). Like
  # slides-relay this is BIND-MOUNTED, not built: lumines_hd/scripts/deploy.sh
  # rsyncs the bundle into /opt/lumines-server, so a redeploy is rsync +
  # `docker compose restart lumines`. Caddy proxies
  # wss://lumines.bobbby.online/ws -> lumines:8903; the static game build is
  # served by Caddy from /opt/lumines. Rooms hold no persistent state.
  lumines:
    image: node:24-alpine
    restart: always
    working_dir: /app
    command: ["node", "server.cjs"]
    environment:
      PORT: "8903"
    expose:
      - "8903"
    volumes:
      - /opt/lumines-server:/app:ro

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /opt/deciduous-site:/srv/deciduous:ro
      - /opt/phstats:/srv/phstats:ro
      - /opt/donny:/srv/donny:ro
      - /opt/blimp:/srv/blimp:ro
      - /opt/arena:/srv/arena:ro  # the Claude Arena snapshot (soldat repo, arena-live/publish.mjs)
      - /opt/soldat-landing:/srv/soldat-landing:ro  # the SOLDAT, REWRITTEN story page (soldat repo, landing/)
      - /opt/slides:/srv/slides:ro  # RevealSlides static build (slides repo dist/, via deploy-slides.sh)
      - /opt/downloader:/srv/downloader:ro  # Framecut Grabber landing page (nathan_for_us site/, via deploy.sh)
      - /opt/lumines:/srv/lumines:ro  # LUMINES HD static build (lumines_hd repo dist/, via its scripts/deploy.sh)

  # The blog, served by a server written in Blimp: blimp_site/ in the blog
  # repo, shipped to /opt/blimp-blog by blimp_site/deploy.sh. Caddy sends it
  # /, /blog, /post/* and its stylesheets, and gives Phoenix anything it
  # answers 404. It forks four workers that each exit after 200 requests;
  # the cap is there in case that arithmetic is ever wrong.
  blimp-blog:
    build:
      context: /opt/blimp-blog
    restart: always
    mem_limit: 1536m
    # The homepage museum and Finder are read from the blog database.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:${DB_PASSWORD}@db/blog_prod
      MTA_API_KEY: ${MTA_API_KEY}
      ICLOUD_ALBUM_TOKEN: ${ICLOUD_ALBUM_TOKEN}
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_BASE_URL: https://api.deepseek.com
      OPENAI_MODEL: deepseek-chat
      OPENAI_AUTOCOMPLETE_MODEL: deepseek-chat
      ZIGGY_CHAT_PASSWORD: ${ZIGGY_CHAT_PASSWORD:-}
      # /who's chat (blimp_site/src/99_who.blimp) falls back to the Ziggy one
      WHO_CHAT_PASSWORD: ${WHO_CHAT_PASSWORD:-}
      # /aim's bobbbyBot (blimp_site/src/99_aim.blimp)
      AIM_API_KEY: ${DEEPSEEK_API_KEY:-}
      AIM_DAILY_LIMIT: ${AIM_DAILY_LIMIT:-600}
      BLINKS_API_TOKEN: ${BLINKS_API_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://bobbby.online}
      FINDER_ADMIN_PASSWORD: ${FINDER_ADMIN_PASSWORD:-}
      CURATE_PASSWORD: ${CURATE_PASSWORD:-}
      RECEIPT_PRINTER_API_TOKEN: ${RECEIPT_PRINTER_API_TOKEN:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-bobbby-media}
    # Not exposed to host - Caddy proxies to port 4100 via Docker network

volumes:
  marginalia_drafts:
  pgdata:
  caddy_data:
  caddy_config:
