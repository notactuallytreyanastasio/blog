# In /opt/blog/docker-compose.yml, under services:. Installed 2026-09-29;
# the file before it is /opt/blog/docker-compose.yml.bak-20260929T141411Z.
# DATABASE_URL and depends_on added 2026-09-29 (backup in /opt/backups/blog/);
# the URL is the one the app service has, password and all.

  # The blog, served by a server written in Blimp: blimp_site/ in the blog
  # repo, shipped to /opt/blimp-blog by blimp_site/deploy.sh. Caddy sends it
  # /, /blog, /post/* and its stylesheets, and gives Phoenix anything it
  # answers 404. It is one long-lived process; the cap is there in case its
  # garbage collection is ever wrong.
  blimp-blog:
    build:
      context: /opt/blimp-blog
    restart: always
    mem_limit: 1536m
    # The homepage museum and Finder are read from the blog database.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://blog:<the app service's password>@db/blog_prod
      # The interpreter's own ceiling on what the program may allocate
      # (heap_limit.zig in Blimp), 1.4 GB. Its default is 2 GiB, above
      # mem_limit, so the first sign of a runaway was the kernel's OOM
      # killer: SIGKILL, nothing in the log. Under the ceiling an allocation
      # that would pass it fails as OutOfMemory instead: that tick is
      # abandoned with a located error in the log, the collection after it
      # frees its garbage, and the next tick serves.
      # Why not lower: boot is the peak, not serving. Boot builds every page
      # with no collection (575MB of heap by the end, measured with this
      # repo's posts and the /aim archive), then promotes what is live to
      # the old space, a copy that needs about twice that. Measured with the
      # e1f2942 interpreter: at 1.15e9 promotion fails ("[serve] PROMOTION
      # FAILED ... no old space") and every collection copies the whole
      # heap again, 23ms pauses instead of 0.5ms; at 1.22e9 it succeeds;
      # at 4e8 boot itself dies. 1.4e9 is that plus 15%. Peak RSS at boot is
      # ~390MB, well under mem_limit (1536m = 1.61e9): this counts address
      # space the allocator handed out, not pages touched. If boot grows
      # (more posts, a bigger archive), look for PROMOTION FAILED in the log
      # and raise this, staying under mem_limit.
      BLIMP_HEAP_LIMIT: "1400000000"
      # Signs session cookies (src/41_web.blimp). With DATABASE_URL set, the
      # site refuses to start without it, or with one under 32 bytes:
      # `openssl rand -base64 48`, kept in /opt/blog/.env.
      SESSION_SECRET: ${SESSION_SECRET}
      # The token the Safari extension and the iOS app send with a write
      # (src/99_blinkswrite.blimp); Phoenix's app service has the same one.
      # Unset, every write is a 401.
      BLINKS_API_TOKEN: ${BLINKS_API_TOKEN}
      # /curate (src/99_curate.blimp): the homepage's cards rearranged
      CURATE_PASSWORD: ${CURATE_PASSWORD:-}
      # Phoenix's own secret_key_base, the app service's value exactly
      # (src/99_blinksanon.blimp). Saves and reactions are keyed by
      # sha256(device_id <> it) and comments carry sha256(ip <> it), so a
      # different value would orphan every save and reaction already made.
      # It also signs the comment post_token, which is a Phoenix.Token that
      # either server accepts. Unset, every anonymous write is a 503.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # Web Push for the /blinks PWA (src/99_blinkspush.blimp): the pair
      # Phoenix's app service has, from /opt/blog/.env. Unset, no pushes and
      # no bell. Set, the site refuses to start unless the private key gives
      # the public one. Needs an interpreter with Blimp #71's P-256/AES-GCM.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://bobbby.online}
      # The /blinks cutover (74). Phoenix still creates links and takes
      # comment writes (Caddy sends them there); here those answer 421
      # until BLINKS_ALL_WRITES=on, which is for the day Phoenix is off.
      # Leave BLINKS_LINK_CHECK and BLINKS_ENRICH_BACKFILL unset while
      # Phoenix's LinkCheck and Enricher run: two sweeps give a link both
      # strikes in one day. BLINKS_WATCH_MS (default 3000, or off) is how
      # often src/99_blinkswatch.blimp looks for rows Phoenix wrote.
      # BLINKS_ALL_WRITES: "on"
      # The receipt printer's token (src/99_receipts.blimp). Unset, every
      # POST /api/receipt_messages/* is 401. It must be the token Phoenix
      # checks: RECEIPT_PRINTER_API_TOKEN from /opt/blog/.env if the app
      # service has it, else the fallback in config/runtime.exs, which is
      # what the printer was set up with. Put it in .env before Caddy sends
      # these POSTs here.
      RECEIPT_PRINTER_API_TOKEN: ${RECEIPT_PRINTER_API_TOKEN}
    # Not exposed to host - Caddy proxies to port 4100 via Docker network
